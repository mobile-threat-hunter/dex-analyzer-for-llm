name: release

# Build platform wheels on a version tag, attach them to THIS repo's Releases,
# and upload the same artifacts to PyPI (so `pip install dexllm` just works).
# The `publish` job needs no setup — it uses the built-in GITHUB_TOKEN
# (contents:write). The `pypi` job needs the PYPI_API_TOKEN repo secret.
# See docs/RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build & publish, e.g. v0.1.0"
        required: true

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  guard:
    # Fail fast unless the tag matches [project].version in pyproject.toml.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: tag == pyproject version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VER="v$(sed -nE 's/^version = "([^"]+)".*/\1/p' pyproject.toml | head -1)"
          echo "tag=$TAG  pyproject=$VER"
          if [ "$TAG" != "$VER" ]; then
            echo "::error::tag '$TAG' != pyproject version '$VER' — bump [project].version first"
            exit 1
          fi

  wheels:
    needs: guard
    name: wheels (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
      - name: Build wheels
        uses: pypa/cibuildwheel@v2.21.3   # bump as needed; >=2.16 for cp313
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: wheelhouse/*.whl

  sdist:
    needs: guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        run: pipx run build --sdist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write   # GITHUB_TOKEN needs write to create this repo's release
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to this repo's Releases
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          ls -la dist
          NOTES="Pre-built dexllm wheels for ${TAG} — Linux (manylinux_2_28 x86_64) + macOS (x86_64+arm64), CPython 3.9-3.13. Download a matching wheel below, then: pip install <wheel-url>"
          # Create the release if absent, else upload/replace assets (re-runnable).
          # --repo is explicit: the publish job has no checkout, so gh can't infer
          # the repo from git. GITHUB_REPOSITORY is auto-set by Actions to owner/repo.
          gh release create "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes "$NOTES" \
            || gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber

  pypi:
    # Same artifacts, second destination: PyPI, so users get a plain
    # `pip install dexllm` with no --find-links. Independent of `publish` —
    # a GitHub-release hiccup shouldn't block the PyPI upload or vice versa.
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    # Named environment so PyPI uploads can be gated on a manual approval
    # (Settings → Environments → pypi → required reviewers). Optional; the
    # environment is auto-created on first run with no protection rules.
    environment:
      name: pypi
      url: https://pypi.org/p/dexllm
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          # PyPI refuses re-uploads of an existing version; skip instead of
          # failing so `workflow_dispatch` on an already-published tag is
          # re-runnable (matching the `--clobber` behaviour above).
          skip-existing: true

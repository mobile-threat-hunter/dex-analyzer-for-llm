name: CI

# Build the native extension and run the self-contained regression gates on
# Linux and macOS. The APK-dependent suites need the gitignored test_apk/ corpus,
# so they SKIP here (never fail) — the C++ parity suites are the APK-free gate.
# One exception: the suite runs a second time narrowed to tests/data/multidex.apk
# (1.2 KB, committed), which reaches 260 tests instead of 114 and is what guards
# dexllm#46's "an environment fact must skip, never fail".
# The heavy harnesses (the full sweep, bench_vs_androguard, dvclass_parity) are
# standalone scripts and are intentionally NOT run here.

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build+test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}

      # DexKit Core links zlib. Linux runners need the dev headers; macOS
      # ships zlib + an Apple Clang with C++20 via the Xcode Command Line Tools.
      - name: System deps (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zlib1g-dev

      - name: Build + install the native extension
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[ioc]"   # tldextract → IOC tests run instead of erroring

      - name: Toolchain for the C++ parity gate
        run: pip install "cmake>=3.20" ninja pybind11 pytest

      - name: Import smoke
        run: python -c "import dexllm; print('dexllm', dexllm.__version__, '-', len(dexllm.tools.tool_definitions()), 'tools')"

      - name: Python suite (APK-dependent tests skip without a corpus)
        run: pytest tests -q

      # dexllm#46: `$DEXLLM_TEST_APK` narrows the WHOLE suite to one sample, and
      # a minimal one carries none of the shapes the non-vacuity floors look for
      # — a `switch` header, a boolean-literal assignment, a constant-only IOC.
      # Those must SKIP, never fail. The corpus-less run above cannot catch a
      # regression of that rule: it skips at the fixtures, before a floor is
      # reached. tests/data/multidex.apk is the sample that produced 17 of the
      # issue's failures, so a green run here is the guard.
      - name: Python suite, narrowed to one minimal APK (dexllm#46)
        env:
          DEXLLM_TEST_APK: tests/data/multidex.apk
        run: pytest tests -q

      # Configure a dedicated CMake tree for the parity tests (the editable
      # install's build dir is tied to scikit-build-core's isolated build env,
      # whose pybind11 is gone post-install, so re-driving it can't re-configure).
      - name: C++ parity suites (primary regression gate — APK-free)
        shell: bash
        run: |
          cmake -B build-ci -S . -G Ninja \
            -DPython_EXECUTABLE="$(which python)" \
            -Dpybind11_DIR="$(python -c 'import pybind11; print(pybind11.get_cmake_dir())')"
          cmake --build build-ci --target parity_tests
          ctest --test-dir build-ci --output-on-failure

  lint:
    name: lint (black / ruff / mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install black ruff mypy
      - run: black --check src/dexllm tests
      - run: ruff check src/dexllm tests
      # mypy's scope is `files = ["src/dexllm"]` in pyproject.toml — the package
      # only, deliberately: `disallow_untyped_defs` is a contract for the shipped
      # API, not for test harnesses (dexllm#40).
      - run: mypy
